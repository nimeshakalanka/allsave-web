# Local development stack: backend API (+ Telegram bot when BOT_TOKEN is set in backend/.env), Next.js and MongoDB.
#   docker compose up --build
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    # Optional cookies for login-walled/age-restricted videos: mount the file and set YTDLP_COOKIES_FILE=/secrets/cookies.txt
    # volumes: ["./secrets/cookies.txt:/secrets/cookies.txt:ro"]
    volumes: ["telegram_data:/data"]
    depends_on: [mongo]
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000  # the browser calls the backend through the host port
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

  mongo:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
    restart: unless-stopped

volumes:
  mongo_data:
  frontend_node_modules:
  telegram_data:
